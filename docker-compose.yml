services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGUSER:-dealerhub}
      POSTGRES_PASSWORD: ${PGPASSWORD:-dealerhub}
      POSTGRES_DB: ${PGDATABASE:-dealerhub}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-dealerhub}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override DB host to point at the compose service
      PGHOST: db
      PGPORT: 5432
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
